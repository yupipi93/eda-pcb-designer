name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (dev extras)
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Validate example configs
        run: |
          pcb-designer validate --config examples/mt1.yaml
          pcb-designer validate --config examples/blank-board/blank.yaml
      - name: Scaffold smoke test (init round-trip)
        run: |
          cd "$(mktemp -d)"
          pcb-designer init ci-board --template full_features --vendor CI
          pcb-designer validate --config projects/ci-board/ci-board.yaml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build pipeline-in-a-box image (KiCad 9 + Java 21 + freerouting)
        run: docker build -t eda-pcb-designer .
      - name: Smoke test — validate MT1 config
        run: docker run --rm -w /app eda-pcb-designer validate --config examples/mt1.yaml
      - name: Smoke test — MT1 place + render stages (real kicad-cli DRC + renders)
        run: docker run --rm -w /app eda-pcb-designer pipeline --config examples/mt1.yaml --stages place,render
