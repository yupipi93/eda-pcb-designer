# Lemon Piano V5.5 Board — pcb-designer config
#
# Canonical configuration for the Lemon Piano V5.5 PCB (breadboard →
# fabricable board, same circuit as arduino-lemon-piano v5.5-power-filter).
# Netlist ground truth: projects/lemon-piano/docs/NETLIST.md.
# Placement rationale: projects/lemon-piano/docs/DECISIONS.md.
#
# Board frame: 100 × 30 mm, MT1 coordinate style (x 90..190, y 100..130).
# Nano socketed (2×15 rows), mini-USB faces the WEST edge; lemon-key header
# on the NORTH service edge; LED bar + SENS buttons on the SOUTH service
# edge; power entry + filter in the EAST block.

project:
  name: lemon-piano
  full_name: "Lemon Piano V5.5 Board"
  version: v0.1.0
  vendor: "Lemon Piano"
  kicad_project_dir: projects/lemon-piano/kicad
  kicad_pcb_file: lemon-piano.kicad_pcb
  kicad_sch_file: lemon-piano.kicad_sch
  validation_output_dir: projects/lemon-piano/validation
  renders_output_dir: projects/lemon-piano/renders
  tools_dir: projects/lemon-piano/tools
  releases_output_dir: projects/lemon-piano/releases

# ----------------------------------------------------------------------------
# Board outline + anchor dividers. Anchor zones are much narrower than MT1's:
# one M2 hole per short edge, mirror-symmetric about x=140.
# ----------------------------------------------------------------------------
geometry:
  pcb:
    x0:  90.0
    y0: 100.0
    x1: 190.0
    y1: 130.0
  anchors:
    left_x:  100.0
    right_x: 180.0

# ----------------------------------------------------------------------------
# PLACEMENTS — [x_mm, y_mm, rot_deg, layer], footprint-origin coordinates.
# rot semantics (KiCad, verified empirically): rot=90 maps local +Y → +X
# (pin rows run EAST from pin 1); rot=270 runs WEST.
# ----------------------------------------------------------------------------
placements:
  # ── Mounting holes: one per short-edge extreme, symmetric about x=140 ────
  H1: [95.0, 115.0, 0, F.Cu]
  H2: [185.0, 115.0, 0, F.Cu]

  # ── Nano socket rows (USB faces WEST edge) ───────────────────────────────
  U1: [104.0, 122.62,  90, F.Cu]   # south row: TX1(west)..D12(east)
  U2: [139.56, 107.38, 270, F.Cu]  # north row: D13(east)..VIN(west)

  # ── Service-edge connectors ──────────────────────────────────────────────
  J2: [114.16, 103.0, 90, F.Cu]    # keys header, pin1=GND above A7, K7..K1 east
  J1: [170.0, 105.9, 0, F.Cu]      # 5V IN screw terminal, wire entry NORTH

  # ── Power-entry filter (east block, flow J1 → D1 → D2 → C1‖C2 → L1 → C3‖C4)
  D1: [159.3, 103.8, 0, F.Cu]      # P6KE6.8A TVS (vertical), K=VIN A=GND
  D2: [150.0, 103.8, 0, F.Cu]      # 1N5817 (vertical), K=VRAW A=VIN
  C1: [159.5, 116.0, 0, F.Cu]      # 470u input reservoir
  L1: [170.0, 116.0, 0, F.Cu]      # 100uH choke
  C3: [171.3, 125.4, 0, F.Cu]      # 470u output reservoir
  C2: [159.5, 111.5, 0, B.Cu]      # 100n input ceramic (bottom)
  C4: [170.0, 121.5, 0, B.Cu]      # 100n output ceramic (bottom)

  # ── UI ───────────────────────────────────────────────────────────────────
  BUZ1: [146.5, 114.2, 0, F.Cu]    # passive buzzer, pad1(+)=D13 net
  SW1: [149.7, 123.4, 0, F.Cu]     # SENS + (D12)
  SW2: [159.9, 123.4, 0, F.Cu]     # SENS − (A7)

  # ── LED bar D3..D12 = LED1..LED10, south strip, one ascending run W→E ────
  # origin = cathode pad; rot=90 puts the anode 2.54 north (toward D2..D11)
  D3:  [103.5, 128.3, 90, F.Cu]
  D4:  [108.1, 128.3, 90, F.Cu]
  D5:  [112.7, 128.3, 90, F.Cu]
  D6:  [117.3, 128.3, 90, F.Cu]
  D7:  [121.9, 128.3, 90, F.Cu]
  D8:  [126.5, 128.3, 90, F.Cu]
  D9:  [131.1, 128.3, 90, F.Cu]
  D10: [135.7, 128.3, 90, F.Cu]
  D11: [140.3, 128.3, 90, F.Cu]
  D12: [144.9, 128.3, 90, F.Cu]

  # ── LED series resistors (bottom, offset +2.3 east of each LED) ──────────
  R8:  [105.8, 127.03, 90, B.Cu]
  R9:  [110.4, 127.03, 90, B.Cu]
  R10: [115.0, 127.03, 90, B.Cu]
  R11: [119.6, 127.03, 90, B.Cu]
  R12: [124.2, 127.03, 90, B.Cu]
  R13: [128.8, 127.03, 90, B.Cu]
  R14: [133.4, 127.03, 90, B.Cu]
  R15: [138.0, 127.03, 90, B.Cu]
  R16: [142.6, 127.03, 90, B.Cu]
  R17: [147.2, 127.03, 90, B.Cu]

  # ── Key pull-ups (bottom, between socket rows, x = its A-pin) ────────────
  R1: [131.94, 110.6, 90, B.Cu]    # KEY1 / A0
  R2: [129.4,  110.6, 90, B.Cu]
  R3: [126.86, 110.6, 90, B.Cu]
  R4: [124.32, 110.6, 90, B.Cu]
  R5: [121.78, 110.6, 90, B.Cu]
  R6: [119.24, 110.6, 90, B.Cu]
  R7: [116.7,  110.6, 90, B.Cu]    # KEY7 / A6
  R18: [114.16, 110.6, 90, B.Cu]   # SENS− pull-up / A7

