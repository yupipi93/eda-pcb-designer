# GROUND TRUTH — physical pinout of every Lemon Piano V5.5 part.
#
# Source of truth for the anti-mirror / anti-pin-swap gate
# (pcb_designer.verify): the .kicad_pcb is compared against THIS file.
# Derived from projects/lemon-piano/docs/NETLIST.md, which itself is
# extracted from arduino-lemon-piano (v5.5 HARDWARE.md + the DRC-validated
# build_v5_5() wirewright contract). Net names as they appear in the
# .kicad_pcb (leading '/').

components:

  # ────────────────────────────────────────────────────────────────────
  # Arduino Nano (ATmega328P) — TWO 1x15 sockets. Canonical frame: viewed
  # from top with the mini-USB UP: left column pins 1-15 (TX1 top),
  # right column pins 16-30 (D13 bottom, VIN top).
  # On this board the Nano mounts on TOP with USB facing WEST (-X):
  # U1 = pins 1-15 (south row, TX1 west), U2 = pins 16-30 (north row,
  # D13 east). chirality_triad guards against the mirror.
  # ────────────────────────────────────────────────────────────────────
  NANO:
    refs: [U1, U2]
    mount_side: top
    source: "Arduino Nano V3 pinout (official): 1..15 TX1,RX0,RST,GND,D2..D12; 16..30 D13,3V3,AREF,A0..A7,5V,RST,GND,VIN"
    pins:
      "U1.1":  {func: TX1,  net: null}
      "U1.2":  {func: RX0,  net: null}
      "U1.3":  {func: RST,  net: null}
      "U1.4":  {func: GND,  net: /GND}
      "U1.5":  {func: D2,   net: /LED1}
      "U1.6":  {func: D3,   net: /LED2}
      "U1.7":  {func: D4,   net: /LED3}
      "U1.8":  {func: D5,   net: /LED4}
      "U1.9":  {func: D6,   net: /LED5}
      "U1.10": {func: D7,   net: /LED6}
      "U1.11": {func: D8,   net: /LED7}
      "U1.12": {func: D9,   net: /LED8}
      "U1.13": {func: D10,  net: /LED9}
      "U1.14": {func: D11,  net: /LED10}
      "U1.15": {func: D12,  net: /SENS_PLUS}
      "U2.1":  {func: D13,  net: /BUZZER}
      "U2.2":  {func: 3V3,  net: null}
      "U2.3":  {func: AREF, net: null}
      "U2.4":  {func: A0,   net: /KEY1}
      "U2.5":  {func: A1,   net: /KEY2}
      "U2.6":  {func: A2,   net: /KEY3}
      "U2.7":  {func: A3,   net: /KEY4}
      "U2.8":  {func: A4,   net: /KEY5}
      "U2.9":  {func: A5,   net: /KEY6}
      "U2.10": {func: A6,   net: /KEY7}
      "U2.11": {func: A7,   net: /SENS_MINUS}
      "U2.12": {func: 5V,   net: /+5V}
      "U2.13": {func: RST,  net: null}
      "U2.14": {func: GND,  net: /GND}
      "U2.15": {func: VIN,  net: null}   # rail feeds the 5V pin, not VIN
    chirality_triad:
      # canonical (+Y up, USB up): left column x=-1, right column x=+1,
      # USB-end pins at y=+7, far-end pins at y=-7.
      - {at: "U1.1",  func: TX1, xy: [-1,  7]}
      - {at: "U2.15", func: VIN, xy: [ 1,  7]}
      - {at: "U1.15", func: D12, xy: [-1, -7]}

  # ────────────────────────────────────────────────────────────────────
  # Service-edge connectors
  # ────────────────────────────────────────────────────────────────────
  KEYS_HEADER:
    refs: [J2]
    mount_side: top
    source: "docs/NETLIST.md — pin1=GND (west, above A7), then KEY7..KEY1"
    pins:
      "J2.1": {func: GND_CLIP, net: /GND}
      "J2.2": {func: KEY7, net: /KEY7}
      "J2.3": {func: KEY6, net: /KEY6}
      "J2.4": {func: KEY5, net: /KEY5}
      "J2.5": {func: KEY4, net: /KEY4}
      "J2.6": {func: KEY3, net: /KEY3}
      "J2.7": {func: KEY2, net: /KEY2}
      "J2.8": {func: KEY1, net: /KEY1}

  POWER_IN:
    refs: [J1]
    mount_side: top
    source: "v5.5 HARDWARE.md — 5 V in (+) and GND; + = pad 1 (west)"
    pins:
      "J1.1": {func: "5V_IN+", net: /VIN}
      "J1.2": {func: "GND",    net: /GND}

  # ────────────────────────────────────────────────────────────────────
  # Power-entry filter (v5.5 HARDWARE.md filter table)
  # ────────────────────────────────────────────────────────────────────
  TVS_P6KE:
    refs: [D1]
    mount_side: top
    source: "P6KE6.8A unidirectional: cathode(K)=pad1 to +, anode=pad2 to GND"
    pins:
      "D1.1": {func: K, net: /VIN}
      "D1.2": {func: A, net: /GND}

  SCHOTTKY_1N5817:
    refs: [D2]
    mount_side: top
    source: "series 1N5817: anode from VIN, cathode into the filter (VRAW)"
    pins:
      "D2.1": {func: K, net: /VRAW}
      "D2.2": {func: A, net: /VIN}

  CAP_IN_BULK:
    refs: [C1]
    mount_side: top
    source: "470uF input reservoir; pad1=+ (KiCad CP_Radial convention)"
    pins:
      "C1.1": {func: "+", net: /VRAW}
      "C1.2": {func: "-", net: /GND}

  CAP_IN_HF:
    refs: [C2]
    mount_side: bottom
    source: "100nF input ceramic (unpolarised)"
    pins:
      "C2.1": {func: a, net: /VRAW}
      "C2.2": {func: b, net: /GND}

  CHOKE:
    refs: [L1]
    mount_side: top
    source: "100uH >=1A drum choke, series element of the pi"
    pins:
      "L1.1": {func: a, net: /VRAW}
      "L1.2": {func: b, net: /+5V}

  CAP_OUT_BULK:
    refs: [C3]
    mount_side: top
    source: "470uF output reservoir at the rail; pad1=+"
    pins:
      "C3.1": {func: "+", net: /+5V}
      "C3.2": {func: "-", net: /GND}

  CAP_OUT_HF:
    refs: [C4]
    mount_side: bottom
    source: "100nF output ceramic (unpolarised)"
    pins:
      "C4.1": {func: a, net: /+5V}
      "C4.2": {func: b, net: /GND}

  # ────────────────────────────────────────────────────────────────────
  # Keyboard pull-ups (220R) + SENS− pull-up (10k). All on B.Cu.
  # pad1 = south = rail (+5V), pad2 = north = the pin node (verified in
  # the built board; the builder assigns these GEOMETRICALLY).
  # ────────────────────────────────────────────────────────────────────
  KEY_PULLUPS:
    refs: [R1, R2, R3, R4, R5, R6, R7]
    mount_side: bottom
    source: "v5 HARDWARE.md — 220R pull-up per key, pin->R->+5V"
    pins:
      "R1.1": {func: rail, net: /+5V}
      "R1.2": {func: pin,  net: /KEY1}
      "R2.1": {func: rail, net: /+5V}
      "R2.2": {func: pin,  net: /KEY2}
      "R3.1": {func: rail, net: /+5V}
      "R3.2": {func: pin,  net: /KEY3}
      "R4.1": {func: rail, net: /+5V}
      "R4.2": {func: pin,  net: /KEY4}
      "R5.1": {func: rail, net: /+5V}
      "R5.2": {func: pin,  net: /KEY5}
      "R6.1": {func: rail, net: /+5V}
      "R6.2": {func: pin,  net: /KEY6}
      "R7.1": {func: rail, net: /+5V}
      "R7.2": {func: pin,  net: /KEY7}

  SENS_MINUS_PULLUP:
    refs: [R18]
    mount_side: bottom
    source: "v5 HARDWARE.md — A7 has no internal pull-up: external 10k to +5V"
    pins:
      "R18.1": {func: rail, net: /+5V}
      "R18.2": {func: pin,  net: /SENS_MINUS}

  # ────────────────────────────────────────────────────────────────────
  # LED bar: LED n anode <- pin n+1, cathode -> 220R -> GND
  # LED pad1 = cathode (KiCad LED_THT), R pad1 = GND (south), pad2 = cathode net
  # ────────────────────────────────────────────────────────────────────
  LED_BAR:
    refs: [D3, D4, D5, D6, D7, D8, D9, D10, D11, D12]
    mount_side: top
    source: "v5 HARDWARE.md — Dn --[220R]--|>-- GND, LED n on pin n+1"
    pins:
      "D3.1":  {func: K, net: /LED1_K}
      "D3.2":  {func: A, net: /LED1}
      "D4.1":  {func: K, net: /LED2_K}
      "D4.2":  {func: A, net: /LED2}
      "D5.1":  {func: K, net: /LED3_K}
      "D5.2":  {func: A, net: /LED3}
      "D6.1":  {func: K, net: /LED4_K}
      "D6.2":  {func: A, net: /LED4}
      "D7.1":  {func: K, net: /LED5_K}
      "D7.2":  {func: A, net: /LED5}
      "D8.1":  {func: K, net: /LED6_K}
      "D8.2":  {func: A, net: /LED6}
      "D9.1":  {func: K, net: /LED7_K}
      "D9.2":  {func: A, net: /LED7}
      "D10.1": {func: K, net: /LED8_K}
      "D10.2": {func: A, net: /LED8}
      "D11.1": {func: K, net: /LED9_K}
      "D11.2": {func: A, net: /LED9}
      "D12.1": {func: K, net: /LED10_K}
      "D12.2": {func: A, net: /LED10}

  LED_RESISTORS:
    refs: [R8, R9, R10, R11, R12, R13, R14, R15, R16, R17]
    mount_side: bottom
    source: "v5 HARDWARE.md — one 220R per LED, cathode->R->GND"
    pins:
      "R8.1":  {func: gnd, net: /GND}
      "R8.2":  {func: k,   net: /LED1_K}
      "R9.1":  {func: gnd, net: /GND}
      "R9.2":  {func: k,   net: /LED2_K}
      "R10.1": {func: gnd, net: /GND}
      "R10.2": {func: k,   net: /LED3_K}
      "R11.1": {func: gnd, net: /GND}
      "R11.2": {func: k,   net: /LED4_K}
      "R12.1": {func: gnd, net: /GND}
      "R12.2": {func: k,   net: /LED5_K}
      "R13.1": {func: gnd, net: /GND}
      "R13.2": {func: k,   net: /LED6_K}
      "R14.1": {func: gnd, net: /GND}
      "R14.2": {func: k,   net: /LED7_K}
      "R15.1": {func: gnd, net: /GND}
      "R15.2": {func: k,   net: /LED8_K}
      "R16.1": {func: gnd, net: /GND}
      "R16.2": {func: k,   net: /LED9_K}
      "R17.1": {func: gnd, net: /GND}
      "R17.2": {func: k,   net: /LED10_K}

  # ────────────────────────────────────────────────────────────────────
  # UI + mechanical
  # ────────────────────────────────────────────────────────────────────
  BUZZER:
    refs: [BUZ1]
    mount_side: top
    source: "v5 HARDWARE.md — passive buzzer on D13; footprint pad1 = +"
    pins:
      "BUZ1.1": {func: "+", net: /BUZZER}
      "BUZ1.2": {func: "-", net: /GND}

  SENS_BUTTONS:
    refs: [SW1, SW2]
    mount_side: top
    source: "v5 HARDWARE.md — SENS+ D12 to GND (internal pull-up); SENS- A7 to GND (R18)"
    pins:
      "SW1.1": {func: pin, net: /SENS_PLUS}
      "SW1.2": {func: gnd, net: /GND}
      "SW2.1": {func: pin, net: /SENS_MINUS}
      "SW2.2": {func: gnd, net: /GND}

  MOUNTING:
    refs: [H1, H2]
    mount_side: top
    source: "board spec — 2x M2, grounded pad+via ring"
    pins:
      "H1.1": {func: hole, net: /GND}
      "H2.1": {func: hole, net: /GND}

# Every net participates in the intent check (C4): the set of pads each
# net touches must match the ground truth exactly.
key_nets:
  - /+5V
  - /GND
  - /VIN
  - /VRAW
  - /KEY1
  - /KEY2
  - /KEY3
  - /KEY4
  - /KEY5
  - /KEY6
  - /KEY7
  - /SENS_MINUS
  - /SENS_PLUS
  - /BUZZER
  - /LED1
  - /LED2
  - /LED3
  - /LED4
  - /LED5
  - /LED6
  - /LED7
  - /LED8
  - /LED9
  - /LED10
  - /LED1_K
  - /LED2_K
  - /LED3_K
  - /LED4_K
  - /LED5_K
  - /LED6_K
  - /LED7_K
  - /LED8_K
  - /LED9_K
  - /LED10_K
