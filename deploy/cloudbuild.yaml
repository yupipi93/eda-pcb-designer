# Cloud Build config for the HTTP API image (deploy/Dockerfile).
#
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#       --substitutions _IMAGE=europe-west1-docker.pkg.dev/<project>/pcb-designer/pcb-designer:<tag> \
#       --project <project> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/Dockerfile", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
